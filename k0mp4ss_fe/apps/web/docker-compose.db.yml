# Docker Compose — PostgreSQL local para desarrollo y migración de prueba
# Uso: docker compose -f docker-compose.db.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: compass-postgres-dev
    environment:
      POSTGRES_USER: compass
      POSTGRES_PASSWORD: compass_dev_2024
      POSTGRES_DB: compass_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compass -d compass_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
