# CI Compass (k0mp4ss): Vitest (unidad/integración con mocks) + E2E Playwright
# (navegador real contra build de producción). Rate-limit corre en job aislado
# porque contamina el contador persistente por IP (SG D-v) — ver
# e2e/auth/rate-limit.spec.ts y avance 2026-08-28.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Token mínimo: el workflow solo lee el repo (checkout) y sube artifacts.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit + integración (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: k0mp4ss_fe/apps/web
    env:
      # Solo BD (para migrate deploy y los tests que usan Prisma real).
      # SIN AUTH_SECRET/NEXT_PUBLIC_APP_ENV: Vitest local no los tiene y los
      # tests auth fijan el suyo en beforeAll (paridad con el entorno local).
      # Base descartable: mismo nombre que la base de la suite
      # (`prisma/perf-test.db`), porque la guarda de `test/db-descartable.setup.ts`
      # aborta siempre si el destino resuelve a `dev.db`.
      DATABASE_URL: file:./perf-test.db
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No dejamos el token del repo en el .git/config: ningún job pushea.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Node 24: mismo runtime de desarrollo. En Node 22 la intercepción
          # fetch de MSW 2 en jsdom rompe las rutas de éxito (push no llega).
          node-version: 24
          cache: npm
          cache-dependency-path: k0mp4ss_fe/package-lock.json
      - run: npm ci
        working-directory: k0mp4ss_fe
      # Dual SQLite/PG (st-migracion-postgres): schema.prisma fuente es
      # postgresql; el job SQLite usa el generado schema.sqlite.prisma.
      - run: npx prisma generate --schema=prisma/schema.sqlite.prisma
      # Algunos tests endpoint (api-admin-usuarios, api-backup-authz) usan
      # Prisma real: necesitan el esquema. Local pasaba porque dev.db existe.
      - run: npx prisma migrate deploy --schema=prisma/schema.sqlite.prisma
      - run: npx tsc --noEmit
      - run: npm test

  unit-pg:
    name: Unit + integración contra PostgreSQL (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: compass
          POSTGRES_PASSWORD: compass_ci
          POSTGRES_DB: compass_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U compass -d compass_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: k0mp4ss_fe/apps/web
    env:
      # PostgreSQL efímero del service container (sin secretos reales).
      DATABASE_URL: postgresql://compass:compass_ci@localhost:5432/compass_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No dejamos el token del repo en el .git/config: ningún job pushea.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Node 24: mismo runtime de desarrollo. En Node 22 la intercepción
          # fetch de MSW 2 en jsdom rompe las rutas de éxito (push no llega).
          node-version: 24
          cache: npm
          cache-dependency-path: k0mp4ss_fe/package-lock.json
      - run: npm ci
        working-directory: k0mp4ss_fe
      # schema.prisma fuente ya es postgresql: generate + db push crean el
      # esquema PG sin migraciones (la baseline PG es tarea 3.2, ventana P2).
      - run: npx prisma generate
      - run: npx prisma db push
      # Paridad con el job SQLite: typecheck también contra el esquema PG.
      - run: npx tsc --noEmit
      - run: npm test

  e2e:
    name: E2E Playwright (build producción)
    runs-on: ubuntu-latest
    needs: unit
    # Corrida única sin fases (serie E2E-SIN-GATED): los specs arman su dato
    # TEST vía API y el resto lee el seed completo (authz + mocks).
    timeout-minutes: 60
    defaults:
      run:
        working-directory: k0mp4ss_fe/apps/web
    env:
      # BD efímera del runner + secret efímero de CI (no es producción).
      # Nombre = base descartable de la suite (`prisma/perf-test.db`): la guarda
      # de `test/db-descartable.setup.ts` aborta siempre ante un destino `dev.db`.
      DATABASE_URL: file:./perf-test.db
      AUTH_SECRET: ci-e2e-secret-no-produccion
      # Importante: el entorno efectivo development desbloquea las APIs de
      # escritura (lib/env-guard.ts isWriteApiEnabled) vía el doble candado del
      # opt-in; next start fija NODE_ENV=production y solo NEXT_PUBLIC_APP_ENV
      # no basta desde el endurecimiento de SERIE-PRODUCCION P2.
      NEXT_PUBLIC_APP_ENV: development
      # Opt-in explícito (e2e-guard-optin-ci): EXCLUSIVO de esta lane de
      # pruebas. Sin él, limpiar() del QA-Lab cae al fallback O(n) por entidad
      # y la limpieza de cola (120 s estrictos) revienta en el runner. Solo
      # habilita escrituras si además NEXT_PUBLIC_APP_ENV=development (doble
      # candado): producción/Vercel sigue bloqueada aunque esté seteado.
      E2E_ALLOW_WRITE_APIS: "1"
      # El guard de AU-autenticacion-sesion exige GOOGLE_CLIENT_ID/SECRET cuando
      # NODE_ENV=production (lo que fija `next build`). En CI son de mentira: el
      # provider no se usa en ningún spec e2e y el build sólo valida presencia.
      GOOGLE_CLIENT_ID: ci-dummy-client-id
      GOOGLE_CLIENT_SECRET: ci-dummy-client-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No dejamos el token del repo en el .git/config: ningún job pushea.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: k0mp4ss_fe/package-lock.json
      - run: npm ci
        working-directory: k0mp4ss_fe
      # Dual SQLite/PG (st-migracion-postgres): schema.prisma fuente es
      # postgresql; los jobs con DATABASE_URL file: usan el generado
      # schema.sqlite.prisma. Sin --schema el CLI lee el schema PG y muere con
      # P1012 ("URL must start with postgresql://").
      - run: npx prisma generate --schema=prisma/schema.sqlite.prisma
      - run: npx playwright install --with-deps chromium
      - name: BD desde cero + seed completo (usuarios TEST + mocks)
        run: |
          npx prisma migrate deploy --schema=prisma/schema.sqlite.prisma
          npm run e2e:reseed-base
      - run: npm run build
      - run: npx playwright test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-e2e
          path: |
            k0mp4ss_fe/apps/web/playwright-report/
            k0mp4ss_fe/apps/web/test-results/
          retention-days: 14

  e2e-rate-limit:
    name: E2E rate-limit (aislado)
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 15
    defaults:
      run:
        working-directory: k0mp4ss_fe/apps/web
    env:
      # Único lugar donde corre: bloquea la IP del runner 15 min al final.
      E2E_RATE_LIMIT: "1"
      # Nombre = base descartable de la suite (`prisma/perf-test.db`): la guarda
      # de `test/db-descartable.setup.ts` aborta siempre ante un destino `dev.db`.
      DATABASE_URL: file:./perf-test.db
      AUTH_SECRET: ci-e2e-secret-no-produccion
      NEXT_PUBLIC_APP_ENV: development
      # Ver nota del job e2e: el build en CI necesita credenciales Google presentes.
      GOOGLE_CLIENT_ID: ci-dummy-client-id
      GOOGLE_CLIENT_SECRET: ci-dummy-client-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No dejamos el token del repo en el .git/config: ningún job pushea.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: k0mp4ss_fe/package-lock.json
      - run: npm ci
        working-directory: k0mp4ss_fe
      - run: npx prisma generate --schema=prisma/schema.sqlite.prisma
      - run: npx playwright install --with-deps chromium
      - name: BD desde cero + seed usuarios TEST
        run: |
          npx prisma migrate deploy --schema=prisma/schema.sqlite.prisma
          npm run seed:authz
      - run: npm run build
      - run: npx playwright test e2e/auth/rate-limit.spec.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-rate-limit
          path: |
            k0mp4ss_fe/apps/web/playwright-report/
            k0mp4ss_fe/apps/web/test-results/
          retention-days: 14

  deploy:
    name: Deploy a Vercel (producción)
    runs-on: ubuntu-latest
    needs: [unit, e2e]
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 10
    defaults:
      run:
        working-directory: k0mp4ss_fe/apps/web
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No dejamos el token del repo en el .git/config: ningún job pushea.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: k0mp4ss_fe/package-lock.json
      - run: npm ci
        working-directory: k0mp4ss_fe
      - run: npx prisma generate
      # Los secrets de Vercel son opcionales: si faltan, el deploy se omite con
      # warning (el workflow queda verde) y cuando el owner los carga corre solo.
      # Antes fallaba con `--token=` vacío, dejando CI rojo por infra ausente.
      - name: Chequear secrets de Vercel
        id: vercel_secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Deploy omitido::Faltan secrets de Vercel (VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID). Cargalos en Settings -> Secrets; este job corre solo."
          fi
      - run: npm i -g vercel@59.16.0
        if: steps.vercel_secrets.outputs.present == 'true'
      - run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        if: steps.vercel_secrets.outputs.present == 'true'
        working-directory: k0mp4ss_fe/apps/web
      - run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        if: steps.vercel_secrets.outputs.present == 'true'
        working-directory: k0mp4ss_fe/apps/web
      - run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        if: steps.vercel_secrets.outputs.present == 'true'
        working-directory: k0mp4ss_fe/apps/web
